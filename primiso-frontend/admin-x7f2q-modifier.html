<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-style.css">
  <title>Modification d'un chantier</title>
</head>
<body>

  <div class="admin-topbar">
    <h1>Modification d'un chantier</h1>
  </div>

  <div class="admin-wrapper">
    <form id="formModifier" class="admin-form-layout">

      <div class="admin-form-fields">
        <input type="text" id="titre" class="admin-input" placeholder="Titre" required>
        <input type="number" id="annee" class="admin-input" placeholder="Année (ex: 2023)" min="2000" max="2030" required>
        <textarea id="description" class="admin-textarea" placeholder="Description courte" required></textarea>
        <textarea id="prestations" class="admin-textarea admin-textarea-large" placeholder="Prestations (une par ligne)" required></textarea>
      </div>

      <div class="admin-photo-panel">
        <button type="button" class="admin-photo-drop" onclick="document.getElementById('inputPhotos').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </button>
        <div class="admin-photo-label">Ajout photo</div>
        <input type="file" id="inputPhotos" accept="image/*" multiple hidden>

        <div>
          <p style="font-family:'Open Sans', sans-serif; font-size:13px; color:#6B7280; margin:10px 0 4px; text-align:center;">Photos existantes</p>
          <div class="admin-photo-previews" id="previewsExistantes"></div>
        </div>

        <div id="blocNouvelles" style="display:none;">
          <p style="font-family:'Open Sans', sans-serif; font-size:13px; color:#6B7280; margin:10px 0 4px; text-align:center;">Nouvelles photos</p>
          <div class="admin-photo-previews" id="previewsNouvelles"></div>
        </div>
      </div>

      <div class="admin-form-buttons" style="width:100%;">
        <button type="button" class="btn-admin btn-danger-admin" onclick="window.location.href='admin-x7f2q-liste.html'">Annuler</button>
        <button type="submit" class="btn-admin btn-primary-admin">Modifier</button>
      </div>

      <p id="message" class="admin-message"></p>
    </form>
  </div>

  <script>
    const API_BASE = 'https://primiso.onrender.com';
    const token = localStorage.getItem('token');

    if (!token) {
      window.location.href = 'admin-x7f2q-login.html';
    }

    const params = new URLSearchParams(window.location.search);
    const chantierId = params.get('id');

    let nouveauxFichiers = [];

    const inputPhotos = document.getElementById('inputPhotos');
    const previewsNouvelles = document.getElementById('previewsNouvelles');
    const blocNouvelles = document.getElementById('blocNouvelles');

    inputPhotos.addEventListener('change', (e) => {
      nouveauxFichiers = nouveauxFichiers.concat(Array.from(e.target.files));
      afficherNouvelles();
      inputPhotos.value = '';
    });

    function afficherNouvelles() {
      blocNouvelles.style.display = nouveauxFichiers.length ? 'block' : 'none';
      previewsNouvelles.innerHTML = '';
      nouveauxFichiers.forEach((fichier, index) => {
        const url = URL.createObjectURL(fichier);
        const wrap = document.createElement('div');
        wrap.className = 'admin-photo-thumb-wrap';
        wrap.innerHTML = `
          <img src="${url}">
          <button type="button" class="admin-photo-remove" onclick="retirerNouvellePhoto(${index})">&times;</button>
        `;
        previewsNouvelles.appendChild(wrap);
      });
    }

    function retirerNouvellePhoto(index) {
      nouveauxFichiers.splice(index, 1);
      afficherNouvelles();
    }

    async function chargerChantier() {
      const message = document.getElementById('message');

      try {
        const reponse = await fetch(`${API_BASE}/chantiers/${chantierId}`);
        if (!reponse.ok) throw new Error('Chantier introuvable');
        const chantier = await reponse.json();

        document.getElementById('titre').value = chantier.titre;
        document.getElementById('description').value = chantier.description;
        document.getElementById('prestations').value = chantier.prestations;

        // Pré-remplit l'année à partir de date_creation (format attendu : AAAA-MM-JJ ou timestamp ISO)
        if (chantier.date_creation) {
          const annee = new Date(chantier.date_creation).getFullYear();
          if (!isNaN(annee)) {
            document.getElementById('annee').value = annee;
          }
        }

        afficherPhotosExistantes(chantier.photos || []);
      } catch (erreur) {
        message.textContent = 'Impossible de charger ce chantier.';
        message.classList.add('erreur');
        console.error(erreur);
      }
    }

    function afficherPhotosExistantes(photos) {
      const conteneur = document.getElementById('previewsExistantes');
      conteneur.innerHTML = '';

      if (!photos.length) {
        conteneur.innerHTML = `<p style="font-family:'Open Sans', sans-serif; font-size:13px; color:#6B7280;">Aucune photo</p>`;
        return;
      }

      photos.forEach((photo) => {
        const wrap = document.createElement('div');
        wrap.className = 'admin-photo-thumb-wrap';
        wrap.innerHTML = `
          <img src="${API_BASE}${photo.chemin}">
          <button type="button" class="admin-photo-remove" onclick="supprimerPhotoExistante(${photo.id}, this)">&times;</button>
        `;
        conteneur.appendChild(wrap);
      });
    }

    async function supprimerPhotoExistante(photoId, bouton) {
      if (!confirm('Supprimer cette photo ?')) return;

      try {
        const reponse = await fetch(`${API_BASE}/photos/${photoId}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!reponse.ok) throw new Error('Suppression impossible');
        bouton.closest('.admin-photo-thumb-wrap').remove();
      } catch (erreur) {
        alert('Impossible de supprimer cette photo.');
        console.error(erreur);
      }
    }

    document.getElementById('formModifier').addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = document.getElementById('message');
      message.textContent = '';
      message.className = 'admin-message';

      const donnees = new FormData();
      donnees.append('titre', document.getElementById('titre').value);
      donnees.append('annee', document.getElementById('annee').value);
      donnees.append('description', document.getElementById('description').value);
      donnees.append('prestations', document.getElementById('prestations').value);
      nouveauxFichiers.forEach((fichier) => donnees.append('photos', fichier));

      try {
        const reponse = await fetch(`${API_BASE}/chantiers/${chantierId}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${token}` },
          body: donnees,
        });

        if (!reponse.ok) {
          const erreur = await reponse.json().catch(() => ({}));
          throw new Error(erreur.erreur || 'Erreur lors de la modification');
        }

        window.location.href = 'admin-x7f2q-liste.html';
      } catch (erreur) {
        message.textContent = erreur.message;
        message.classList.add('erreur');
      }
    });

    chargerChantier();
  </script>
</body>
</html>
